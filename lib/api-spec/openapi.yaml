openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /health/bot:
    get:
      operationId: botHealthCheck
      tags: [health]
      summary: Bot & server diagnostics
      description: Server uptime, bot mode/status, session count, lookup stats
      responses:
        "200":
          description: Diagnostics payload
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BotHealth"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    BotHealth:
      type: object
      properties:
        server:
          type: object
          properties:
            startedAt:
              type: string
            uptimeSec:
              type: number
            memoryRssMb:
              type: number
            nodeVersion:
              type: string
        bot:
          type: object
          properties:
            enabled:
              type: boolean
            mode:
              type: string
            startedAt:
              type: string
              nullable: true
            webhookUrl:
              type: string
              nullable: true
            lastError:
              type: string
              nullable: true
            pollErrors:
              type: number
        sessions:
          type: number
        lookups:
          type: object
          properties:
            total:
              type: number
            cacheHits:
              type: number
            failures:
              type: number
            cacheSize:
              type: number

